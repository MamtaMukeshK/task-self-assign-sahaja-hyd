<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --fg:#1b1b1f; --muted:#666; --line:#e2e2e6; --bg:#fff; --mine:#e8f5e9; --taken:#f5f5f7; --accent:#1a73e8; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  input:not([type]), input[id=name], input[id=mobile] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; min-width:180px; }
  button { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  button.release { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  td a { color:var(--accent); word-break:break-all; }
  .clash { color:var(--muted); font-size:12px; }
  #status, #updated, #note { color:var(--muted); }
  #status.err { color:var(--err); font-weight:600; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:pre-line; }
  th, td { min-width:7em; }
  th:first-child, td:first-child { min-width:0; }
  th { position:sticky; top:0; background:#fafafa; font-weight:600; }
  tr.mine td { background:var(--mine); }
  tr.taken td { background:var(--taken); color:var(--muted); }
  .who { font-weight:600; color:var(--fg); }
  .person { white-space:nowrap; }  /* name and number stay on one line; the column widens to fit */
  .person + .person { border-top:2px solid #9aa0a6; margin-top:6px; padding-top:6px; }
  .person.extra { color:var(--err); }                      /* people beyond the school's total */
  .overcount { color:var(--err); font-weight:700; }
  tr.overrow td { background:#fdecea; }
  .via { color:var(--muted); font-weight:400; }
  button.warn { background:#fff; color:var(--err); border-color:var(--err); }
  button.x { padding:0 7px; margin-left:8px; background:#fff; color:var(--err); border-color:var(--err); font-size:12px; }
  #othersBox { flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; }
  #othersBox[hidden] { display:none; }
  #picker summary { cursor:pointer; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fafafa; }
  #picker[open] summary { border-radius:6px 6px 0 0; }
  #pickSearch { display:block; width:100%; min-width:0; margin:0; border-radius:0; }
  #pickList { max-height:260px; overflow:auto; border:1px solid var(--line); border-top:0; border-radius:0 0 6px 6px; padding:4px 0; min-width:280px; }
  #pickList label { display:block; padding:3px 10px; white-space:nowrap; }
  #pickList label.nomobile { color:var(--muted); }
  #pickList input.firstmobile { width:130px; min-width:0; margin-left:8px; padding:2px 6px; }
  textarea { font:inherit; min-width:280px; min-height:64px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <label>Date <select id="day"></select></label>
  <label>Your name <input id="name" autocomplete="off" list="speakerNames" placeholder="type or pick your name"><datalist id="speakerNames"></datalist></label>
  <label>Mobile <input id="mobile" autocomplete="tel" inputmode="tel" placeholder="10 digits" maxlength="16"></label>
  <label><input type="checkbox" id="showOthers"> Register others</label>
  <label><input type="checkbox" id="openOnly"> Open only</label>
  <div id="othersBox" hidden>
    <details id="picker">
      <summary>Choose speakers (<span id="pickCount">0</span> selected)</summary>
      <input id="pickSearch" placeholder="Search names">
      <div id="pickList"></div>
    </details>
    <textarea id="others" placeholder="One person per line: name, then 10-digit mobile&#10;Ravi Kumar 9123456789&#10;Asha 9000000002"></textarea>
    <label><input type="checkbox" id="includeMe" checked> Include me too</label>
  </div>
  <span id="status"></span>
  <span id="updated"></span>
  <span id="note"></span>
</header>
<div class="wrap"><table id="grid"></table></div>

<script>
  var POLL_MS = 15000;
  var state = null;
  var seq = 0;      // ignore responses older than the newest one already shown
  var shownSeq = 0;
  var busyRow = null;
  var nameInput = document.getElementById('name');
  var mobileInput = document.getElementById('mobile');
  var openOnly = document.getElementById('openOnly');

  // Remember name/mobile in this browser only (per-viewer convenience).
  [[nameInput, 'selfAssignName'], [mobileInput, 'selfAssignMobile']].forEach(function (p) {
    try { p[0].value = localStorage.getItem(p[1]) || ''; } catch (e) {}
    p[0].addEventListener('input', function () {
      try { localStorage.setItem(p[1], p[0].value); } catch (e) {}
      render();
    });
  });
  openOnly.addEventListener('change', render);
  var showOthers = document.getElementById('showOthers');
  var othersBox = document.getElementById('othersBox');
  var othersInput = document.getElementById('others');
  var includeMe = document.getElementById('includeMe');
  try { othersInput.value = localStorage.getItem('selfAssignOthers') || ''; } catch (e) {}
  othersInput.addEventListener('input', function () { try { localStorage.setItem('selfAssignOthers', othersInput.value); } catch (e) {} render(); });
  showOthers.addEventListener('change', function () { othersBox.hidden = !showOthers.checked; render(); });
  includeMe.addEventListener('change', render);
  // People ticked in "Choose speakers", keyed 'name|mobile'.
  var picked = {};
  var pickList = document.getElementById('pickList');
  var pickSearch = document.getElementById('pickSearch');
  pickSearch.addEventListener('input', function () { drawPicker(true); });
  function digitsOf(v) { var d = String(v).replace(/\D/g, ''); return d.length > 10 ? d.slice(-10) : d; }
  function pickedLines() { return Object.keys(picked).map(function (k) { return picked[k].name + ' ' + picked[k].mobile; }); }
  function othersText() {
    if (!showOthers.checked) return '';
    // Typed lines first so "Line N" in messages matches the box; ticked speakers follow.
    return [othersInput.value].concat(pickedLines()).join('\n').trim() ? [othersInput.value].concat(pickedLines()).join('\n') : '';
  }
  // Alphabetical speaker list (from the speakers tab) with search and tick boxes.
  function drawPicker(force) {
    var speakers = (state && state.speakers) || [];
    var sig = JSON.stringify(speakers) + '|' + pickSearch.value;
    if (!force && pickList.dataset.sig === sig) return;
    pickList.dataset.sig = sig;
    // Someone ticked without a saved mobile, whose number has since been saved: keep them ticked under the new entry.
    Object.keys(picked).forEach(function (k) {
      var p = picked[k];
      if (/\|$/.test(k) && speakers.some(function (sp) { return sp.mobile && same(sp.name, p.name) && sp.mobile === digitsOf(p.mobile); })) {
        delete picked[k];
        picked[p.name.toLowerCase() + '|' + digitsOf(p.mobile)] = { name: p.name, mobile: digitsOf(p.mobile) };
      }
    });
    var q = pickSearch.value.trim().toLowerCase();
    pickList.textContent = '';
    speakers.forEach(function (sp) {
      if (q && sp.name.toLowerCase().indexOf(q) < 0 && sp.mobile.indexOf(q) < 0) return;
      var key = sp.name.toLowerCase() + '|' + sp.mobile;
      var label = document.createElement('label');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!picked[key];
      box.onchange = function () {
        if (box.checked) picked[key] = { name: sp.name, mobile: sp.mobile }; else delete picked[key];
        updatePickCount(); drawPicker(true); render();
      };
      label.appendChild(box);
      label.appendChild(document.createTextNode(' ' + sp.name + (sp.mobile ? ' · ' + sp.mobile : ' (no mobile saved yet)')));
      if (!sp.mobile) {
        label.className = 'nomobile';
        // First time only: ask for their number; it is saved to the speakers tab when they are registered.
        if (picked[key]) {
          var num = document.createElement('input');
          num.className = 'firstmobile';
          num.placeholder = '10-digit mobile';
          num.inputMode = 'tel';
          num.value = picked[key].mobile;
          num.oninput = function () { picked[key].mobile = num.value; };
          label.appendChild(num);
        }
      }
      pickList.appendChild(label);
    });
    if (!pickList.childNodes.length) pickList.textContent = speakers.length ? 'No match.' : 'No speakers saved yet.';
    var names = document.getElementById('speakerNames');
    if (names.dataset.sig !== JSON.stringify(speakers)) {
      names.dataset.sig = JSON.stringify(speakers);
      names.textContent = '';
      speakers.forEach(function (sp) { if (sp.mobile) names.appendChild(new Option(sp.name + ' · ' + sp.mobile, sp.name)); });
    }
  }
  function updatePickCount() { document.getElementById('pickCount').textContent = Object.keys(picked).length; }
  // Picking your own name from the list fills in your saved mobile.
  nameInput.addEventListener('change', function () {
    var me = myName();
    var known = ((state && state.speakers) || []).filter(function (x) { return same(x.name, me); });
    var sp = known.filter(function (x) { return x.mobile; })[0];
    if (known.length && !sp && !tenDigits(mobileInput.value)) {
      setStatus('First time: please enter your 10-digit mobile. It will be saved, so you won\'t be asked again.', true);
      mobileInput.focus();
    }
    if (sp && !tenDigits(mobileInput.value)) {
      mobileInput.value = sp.mobile;
      try { localStorage.setItem('selfAssignMobile', sp.mobile); } catch (e) {}
      render();
    }
  });
  function meIncluded() { return !showOthers.checked || includeMe.checked; }
  // Same line rule as the script: a name, then a 10-digit mobile.
  function checkOthers(text) {
    var lines = text.split('\n'), n = 0;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var m = /^(.*?)[\s,:\-]*((?:\+?91|0)?[\d\s\-().]{10,})$/.exec(line);
      if (!m || !m[1].trim() || !tenDigits(m[2])) return 'Line ' + (i + 1) + ' of "Register others" should be a name then a 10-digit mobile, like "Ravi 9123456789".';
      n++;
    }
    return n;
  }

  function myName() { return nameInput.value.replace(/\s+/g, ' ').trim(); }
  // Same rule as the script: 10 digits, optionally after +91 / 91 / 0; spaces and dashes ignored.
  function tenDigits(v) { return /^(\+?91|0)?\d{10}$/.test(String(v).replace(/[\s\-().]/g, '')); }
  function same(a, b) { return a.toLowerCase() === b.toLowerCase(); }

  function setStatus(msg, isErr) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
  }

  function call(fn, args, okMsg) {
    var mySeq = ++seq;
    var runner = google.script.run
      .withSuccessHandler(function (s) {
        if (mySeq < shownSeq) return;
        shownSeq = mySeq; state = s; busyRow = null;
        render();
        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
        if (okMsg) setStatus(typeof okMsg === 'function' ? okMsg(s) : okMsg);
      })
      .withFailureHandler(function (err) {
        busyRow = null;
        setStatus(err.message || String(err), true);
        if (fn !== 'getState') refresh(); // show the latest truth after a failed claim
        else render();
      });
    runner[fn].apply(runner, args);
  }

  var daySelect = document.getElementById('day');
  var pickedDay = ''; // '' = today (or the next day with a tab)
  daySelect.addEventListener('change', function () {
    pickedDay = daySelect.value;
    shownSeq = ++seq; // ignore answers still on their way for the previous day
    state = null; busyRow = null;
    document.getElementById('grid').textContent = '';
    document.getElementById('title').textContent = 'Loading…';
    setStatus('');
    refresh();
  });

  function refresh() { call('getState', [pickedDay]); }

  function act(fn, r, verb, target) {
    if (!myName()) { setStatus('Please enter your name first.', true); nameInput.focus(); return; }
    var claiming = fn === 'claimRow';
    if (claiming && meIncluded() && !tenDigits(mobileInput.value)) { setStatus('Please enter a 10-digit mobile number.', true); mobileInput.focus(); return; }
    if (claiming && showOthers.checked) {
      var missing = Object.keys(picked).map(function (k) { return picked[k]; }).filter(function (p) { return !tenDigits(p.mobile); })[0];
      if (missing) {
        setStatus('Please enter a 10-digit mobile for ' + missing.name + ' in "Choose speakers" (asked once; it will be saved).', true);
        document.getElementById('picker').open = true;
        return;
      }
    }
    if (claiming) {
      var n = checkOthers(othersText());
      if (typeof n === 'string') { setStatus(n, true); othersInput.focus(); return; }
      if (!n && !meIncluded()) { setStatus('Nobody to register: tick "Include me too" or add people under "Register others".', true); return; }
    }
    busyRow = r.row;
    render();
    setStatus(verb + '…');
    var args = claiming ? [r.row, r.fp, myName(), mobileInput.value, state.tab, othersText(), meIncluded()]
      : fn === 'removePerson' ? [r.row, r.fp, myName(), target, state.tab]
      : [r.row, r.fp, myName(), state.tab];
    call(fn, args, function (s) {
      if (!claiming) return fn === 'removePerson' ? 'Removed ' + target + '.' : 'Released.';
      var now = s.rows.filter(function (x) { return x.row === r.row; })[0];
      return 'Registered.' + (now && now.over ? ' Note: this school is now over its limit by ' + now.over + ' (shown in red).' : '');
    });
  }

  // Web addresses in a cell become links (map links read "Open map"); the rest stays plain text.
  var URL_RE = /https?:\/\/[^\s"'<>]+/g;
  function addText(el, text) {
    var last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      el.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');
      a.href = m[0];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = /maps\.google\.|google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(m[0]) ? 'Open map' : m[0];
      el.appendChild(a);
      last = m.index + m[0].length;
    }
    el.appendChild(document.createTextNode(text.slice(last)));
  }

  function render() {
    if (!state) return;
    pickedDay = state.tab;
    var days = state.days || [];
    if (daySelect.dataset.list !== JSON.stringify(days)) {
      daySelect.dataset.list = JSON.stringify(days);
      daySelect.textContent = '';
      days.forEach(function (d) { daySelect.add(new Option(d.label, d.name)); });
    }
    daySelect.value = state.tab;
    document.getElementById('title').textContent = 'Day: ' + state.tab;
    drawPicker(false);
    var me = myName();
    var t = document.getElementById('grid');
    t.textContent = '';
    var head = t.insertRow();
    document.getElementById('note').textContent = state.slotsHeader
      ? 'Places per school from column "' + state.slotsHeader.replace(/\s+/g, ' ') + '"'
      : 'No "Total volunteers needed" column on this tab, so each school takes 1 person.';
    // The sheet's own speaker column is left out: "SY Speaker Name" shows the same people, one per line.
    var shown = function (_, i) { return i !== state.nameIdx; };
    ['', 'Slots left', 'SY Speaker Name'].concat(state.headers.filter(shown)).forEach(function (h) {
      var th = document.createElement('th'); th.textContent = h; head.appendChild(th);
    });
    var open = 0;
    function isMine(r) { return !!me && r.assignees.some(function (a) { return same(a.name, me); }); }
    var myStarts = {}; // start time -> first S No I'm on at that time
    state.rows.forEach(function (r) { if (r.start && isMine(r) && !myStarts[r.start]) myStarts[r.start] = ((state.headers[0] || '').trim() + ' ' + r.cells[0]).trim() || ('row ' + r.row); });
    state.rows.forEach(function (r) {
      var mine = isMine(r);
      var justMe = meIncluded() && !othersText().trim();
      var clashWith = justMe && !mine && r.start ? myStarts[r.start] : '';
      var hasRoom = r.remaining > 0;
      if (hasRoom) open++;
      if (openOnly.checked && !hasRoom && !mine) return;
      var tr = t.insertRow();
      tr.className = mine ? 'mine' : r.over ? 'overrow' : (hasRoom ? '' : 'taken');
      var btnCell = tr.insertCell();
      var addButton = function (label, cls, handler) {
        var b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.disabled = busyRow !== null;
        b.onclick = handler;
        btnCell.appendChild(b);
      };
      if (r.total <= 0) {
        btnCell.textContent = 'Closed';
      } else if (clashWith) {
        var note = document.createElement('span');
        note.className = 'clash';
        note.textContent = 'Clashes with ' + clashWith + ' (' + r.start + ')';
        btnCell.appendChild(note);
      } else if (!mine || !justMe) {
        // A full school can still take more; the extra people show in red.
        addButton(hasRoom ? 'Claim' : 'Claim (full)', hasRoom ? '' : 'warn', function () { act('claimRow', r, 'Registering'); });
      }
      if (mine) addButton('Release', 'release', function () { act('releaseRow', r, 'Releasing'); });
      var slots = tr.insertCell();
      if (r.over) { slots.className = 'overcount'; slots.textContent = 'Over by ' + r.over + ' (needs ' + r.total + ')'; }
      else slots.textContent = r.remaining + ' of ' + r.total;
      var who = tr.insertCell();
      who.className = 'who';
      r.assignees.forEach(function (a, i) {
        var line = document.createElement('div');
        line.className = 'person';
        var extra = i >= r.total;
        if (extra) line.className += ' extra';
        line.textContent = (r.assignees.length > 1 ? (i + 1) + '. ' : '') + (a.phone ? a.name + ' · ' + a.phone : a.name) +
          (extra ? ' (over limit)' : '');
        if (a.by) {
          var via = document.createElement('span');
          via.className = 'via';
          via.textContent = ' · via ' + a.by;
          line.appendChild(via);
        }
        if (me && a.by && same(a.by, me) && !same(a.name, me)) {
          var x = document.createElement('button');
          x.className = 'x';
          x.textContent = '✕';
          x.title = 'Remove ' + a.name;
          x.disabled = busyRow !== null;
          x.onclick = function () { act('removePerson', r, 'Removing', a.name); };
          line.appendChild(x);
        }
        who.appendChild(line);
      });
      r.cells.filter(shown).forEach(function (c) {
        var td = tr.insertCell();
        addText(td, c);
      });
    });
    document.title = open + ' with free slots · ' + state.tab;
    if (!state.rows.length) t.insertRow().insertCell().textContent = 'No rows on this tab yet.';
  }

  refresh();
  setInterval(function () { if (!document.hidden && busyRow === null) refresh(); }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
</script>
</body>
</html>
