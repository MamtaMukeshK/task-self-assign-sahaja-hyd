<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --fg:#1b1b1f; --muted:#666; --line:#e2e2e6; --bg:#fff; --mine:#e8f5e9; --taken:#f5f5f7; --accent:#1a73e8; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  input:not([type]), input[id=name], input[id=mobile] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; min-width:180px; }
  button { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  button.release { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  td a { color:var(--accent); word-break:break-all; }
  .clash { color:var(--muted); font-size:12px; }
  #status, #updated, #note, #clock { color:var(--muted); }
  #clock { font-size:12px; }
  #status.err { color:var(--err); font-weight:600; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:pre-line; }
  th, td { min-width:7em; }
  th:first-child, td:first-child { min-width:0; }
  th { position:sticky; top:0; background:#fafafa; font-weight:600; }
  tr.mine td { background:var(--mine); }
  tr.taken td { background:var(--taken); color:var(--muted); }
  .who { font-weight:600; color:var(--fg); }
  .person { white-space:nowrap; }  /* name and number stay on one line; the column widens to fit */
  .person + .person { border-top:2px solid #9aa0a6; margin-top:6px; padding-top:6px; }
  .person.extra { color:var(--err); }                      /* people beyond the school's total */
  .overcount { color:var(--err); font-weight:700; }
  tr.overrow td { background:#fdecea; }
  tr.past td, tr.past td * { background:#eeeeee !important; color:#9aa0a6 !important; border-color:#d5d5d5; }
  #pastNote { flex-basis:100%; padding:6px 10px; border-radius:6px; background:#eeeeee; color:#5f6368; font-weight:600; }
  #pastNote[hidden] { display:none; }
  .via { color:var(--muted); font-weight:400; }
  button.warn { background:#fff; color:var(--err); border-color:var(--err); }
  button.x { padding:0 7px; margin-left:8px; background:#fff; color:var(--err); border-color:var(--err); font-size:12px; }
  #othersBox { flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; }
  #othersBox[hidden] { display:none; }
  #picker summary { cursor:pointer; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fafafa; }
  #picker[open] summary { border-radius:6px 6px 0 0; }
  #pickSearch { display:block; width:100%; min-width:0; margin:0; border-radius:0; }
  #pickList { max-height:260px; overflow:auto; border:1px solid var(--line); border-top:0; border-radius:0 0 6px 6px; padding:4px 0; min-width:280px; }
  #pickList label { display:block; padding:3px 10px; white-space:nowrap; }
  #pickList label.nomobile { color:var(--muted); }
  #pickList input.firstmobile { width:130px; min-width:0; margin-left:8px; padding:2px 6px; }
  textarea { font:inherit; min-width:280px; min-height:64px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
</style>
</head>

  <label><span data-t="mobile">Mobile</span> <input id="mobile" autocomplete="tel" inputmode="tel" data-tp="mobilePh" maxlength="16"></label>
  <label id="showOthersLabel"><input type="checkbox" id="showOthers"> <span data-t="registerOthers">Register others</span></label>
  <label><input type="checkbox" id="openOnly"> <span data-t="openOnly">Open only</span></label>
  <div id="othersBox" hidden>
    <details id="picker">
      <summary id="pickSummary"></summary>

      <div id="pickList"></div>

    <textarea id="others" data-tp="othersPh"></textarea>
    <label><input type="checkbox" id="includeMe" checked> <span data-t="includeMe">Include me too</span></label>

  <span id="status"></span>
  <span id="updated"></span>
  <span id="note"></span>
  <span id="clock"></span>
</header>
<div class="wrap"><table id="grid"></table></div>

    LANG = langSelect.value;
    applyStaticText();
    setStatus('');
    if (lastUpdated) document.getElementById('updated').textContent = t('updated', lastUpdated);
    pickList.dataset.sig = '';
    if (state) { drawPicker(true); render(); } else document.getElementById('title').textContent = t('loading');
  });
  applyStaticText();

  refresh();
  setInterval(function () { if (!document.hidden && busyRow === null) refresh(); }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
</script>
</body>
</html>
