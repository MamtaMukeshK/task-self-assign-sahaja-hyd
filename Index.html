<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<!-- Fonts from the Sahaja Yoga proposal deck (DM Sans, Instrument Serif), plus Noto for Telugu and Hindi. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- media="print" + onload: the page is drawn without waiting for the fonts, which swap in when ready. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Colours from the deck: navy #1A3A5C, slate #34485F, blue #4A6FA5, gold #C9A84C, pale blue #E1F0FB, cream #FBFAF6. */
  :root { --navy:#1A3A5C; --fg:#34485F; --muted:#5A6B82; --line:#D9E6F2; --bg:#FBFAF6; --band:#E1F0FB; --gold:#C9A84C;
          --blue:#4A6FA5; --mine:#e6f4ea; --taken:#F1F4F8; --accent:#1A3A5C; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.45 'DM Sans', 'Noto Sans Telugu', 'Noto Sans Devanagari', system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #brand { display:flex; align-items:center; gap:14px; margin:-16px -16px 16px; padding:14px 16px 12px;
           background:linear-gradient(180deg, var(--band), #f6fafd); border-bottom:3px solid var(--gold); }
  #logo { height:52px; width:auto; flex:none; }
  #brand h1 { margin:0; font:400 clamp(22px, 4.2vw, 32px)/1.1 'Instrument Serif', 'Noto Sans Telugu', 'Noto Sans Devanagari', serif; color:var(--navy); }
  #brandSub { display:block; margin-top:3px; font:500 clamp(13px, 2.4vw, 16px)/1.3 'DM Sans', 'Noto Sans Telugu', 'Noto Sans Devanagari', sans-serif;
              color:var(--blue); letter-spacing:.02em; }
  #demoBtn { margin-left:auto; flex:none; padding:9px 16px; border-radius:24px; border:0; background:var(--gold); color:var(--navy);
             font-weight:700; font-size:15px; box-shadow:0 2px 6px rgba(26,58,92,.25); }
  #demoBtn:hover { background:#d8b95c; }
  @media (max-width: 640px) { #brand { flex-wrap:wrap; } #demoBtn { margin-left:0; width:100%; } }
  #demoBox { position:fixed; inset:0; z-index:50; background:rgba(10,25,40,.85); display:flex; align-items:center; justify-content:center; padding:12px; }
  #demoBox[hidden] { display:none; }
  #demoInner { position:relative; width:min(960px, 100%); }
  #demoVideo { width:100%; max-height:80vh; background:#000; border-radius:10px; display:block; }
  #demoClose { position:absolute; top:-14px; right:-6px; z-index:1; width:38px; height:38px; padding:0; border-radius:50%;
               background:#fff; color:var(--navy); border:2px solid var(--gold); font-size:18px; }
  #demoHelp { margin:8px 0 0; text-align:center; } #demoHelp a { color:#fff; }
  /* Controls above the school list: large text for easy reading (many users are elderly). */
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-bottom:14px; font-size:18px; }
  header input[type=checkbox] { width:22px; height:22px; margin:0 4px 0 0; vertical-align:middle; flex:none; }
  header select, header input:not([type=checkbox]), header textarea, #picker summary { font-size:18px; }
  /* "Day: 30-Sep" repeats the Date picker, so it is hidden from view but still read out by screen readers. */
  h2#title { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  input:not([type]), input[id=name], input[id=mobile] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; min-width:180px; background:#fff; color:var(--navy); }
  button { font:inherit; font-weight:500; padding:5px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { background:#24507c; }
  button.release { background:#fff; color:var(--accent); }
  button.release:hover:not(:disabled) { background:#E6EEF7; }   /* white buttons stay readable (phones keep hover after a tap) */
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--navy); }
  td a { color:var(--blue); overflow-wrap:anywhere; }
  .clash { color:var(--muted); font-size:12px; }
  #status, #updated, #note, #clock { color:var(--muted); }
  #status { font-size:18px; }
  #updated, #note { font-size:16px; }
  #clock { font-size:14px; }
  #status.err { color:var(--err); font-weight:600; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff; }
  table { border-collapse:separate; border-spacing:0; width:100%; }  /* separate: frozen columns draw cleanly */
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:pre-line; }
  th, td { min-width:7em; }
  th:first-child, td:first-child { min-width:0; }
  th { position:sticky; top:0; background:#E6EEF7; color:var(--navy); font-weight:700; }
  tr.mine td { background:var(--mine); }
  tr.taken td { background:var(--taken); color:var(--muted); }
  .who { font-weight:600; color:var(--navy); }
  .person { white-space:nowrap; }  /* name and number stay on one line; the column widens to fit */
  .person + .person { border-top:2px solid #9aa0a6; margin-top:6px; padding-top:6px; }
  .person.extra { color:var(--err); }                      /* people beyond the school's total */
  .overcount { color:var(--err); font-weight:700; }
  tr.overrow td { background:#fdecea; }
  tr.past td, tr.past td * { background:#eeeeee !important; color:#9aa0a6 !important; border-color:#d5d5d5; }
  #pastNote { flex-basis:100%; padding:6px 10px; border-radius:6px; background:#eeeeee; color:#5f6368; font-weight:600; }
  #pastNote[hidden] { display:none; }
  .via { color:var(--muted); font-weight:400; }
  button.warn { background:#fff; color:var(--err); border-color:var(--err); }
  button.x { padding:0 7px; margin-left:8px; background:#fff; color:var(--err); border-color:var(--err); font-size:12px; }
  #othersBox { flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; }
  #othersBox[hidden] { display:none; }
  #picker summary { cursor:pointer; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--navy); }
  #picker[open] summary { border-radius:6px 6px 0 0; }
  #pickSearch { display:block; width:100%; min-width:0; margin:0; border-radius:0; }
  #pickList { max-height:260px; overflow:auto; border:1px solid var(--line); border-top:0; border-radius:0 0 6px 6px; padding:4px 0; min-width:280px; }
  #pickList label { display:block; padding:3px 10px; white-space:nowrap; }
  #pickList label.nomobile { color:var(--muted); }
  #pickList input.firstmobile { width:130px; min-width:0; margin-left:8px; padding:2px 6px; }
  textarea { font:inherit; min-width:280px; min-height:64px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  td { background:#fff; }
  h3.sect { font:400 21px/1.2 'Instrument Serif', 'Noto Sans Telugu', 'Noto Sans Devanagari', serif; color:var(--navy); margin:14px 0 8px; }
  h3.sect[hidden], #mineBox[hidden] { display:none; }
  #mineBox .wrap { border-color:#2e7d32; }
  @keyframes ring { from { box-shadow:0 0 0 4px var(--gold); } to { box-shadow:0 0 0 0 rgba(201,168,76,0); } }
  @keyframes flashbg { from { background:#fff3b0; } }
  tr.flash { animation:ring 2s ease-out; }
  @media (min-width: 1101px) { tr.flash td { animation:flashbg 2s ease-out; } }
  #loadingBox { display:flex; align-items:center; gap:10px; padding:18px 14px; margin:8px 0; border:1px solid var(--line); border-radius:12px;
                background:#fff; color:var(--navy); font-weight:600; }
  #loadingBox[hidden] { display:none; }
  .spin { width:20px; height:20px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  td.c-toggle { display:none; }                            /* the "Details" button is for the phone cards only */
  .roleline { display:block; white-space:nowrap; }   /* Ongoing tab: Primary count, then Backup count below it */
  /* "Backup" next to a name: solid gold with navy text (contrast 5.1:1), so backups stand out; grey on ended programs */
  .roletag { margin-left:6px; padding:1px 8px; border-radius:10px; background:var(--gold); color:var(--navy); font-size:12px; font-weight:700; }
  /* Phones: a round call button next to each volunteer's name instead of the number (tapping opens the dial pad). */
  a.call { display:none; }
  @media (max-width: 700px) {
    .person .num { display:none; }
    a.call { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; margin-left:8px; vertical-align:middle;
             border-radius:50%; background:var(--band); color:var(--navy); }
    a.call svg { width:18px; height:18px; }
  }
  /* Sl.No, the button and "Slots left" stay put while the table scrolls sideways (left set by pinColumns). */
  th.stick, td.stick { position:sticky; z-index:1; }
  th.stick { z-index:3; }
  .stick-last { box-shadow:inset -2px 0 0 var(--line); }
  /* Phones: the controls stack full width, with text big enough that phones don't zoom in. */
  @media (max-width: 700px) {
    body { padding:12px; }
    #brand { margin:-12px -12px 14px; padding:12px; }
    header { gap:8px; }
    header label { display:flex; align-items:center; gap:8px; width:100%; }
    header label[hidden] { display:none; }
    header label > input:not([type=checkbox]), header label > select { flex:1; min-width:0; padding:10px; font-size:18px; }
    textarea { min-width:0; width:100%; font-size:18px; }
    #picker { width:100%; } #pickList { min-width:0; }
  }
  /* Phones and tablets: each school becomes a card; no sideways scrolling. Laptops keep the full table. */
  @media (max-width: 1100px) {
    .wrap { overflow:visible; border:0; background:transparent; }
    table.grid, table.grid tbody { display:block; }
    table.grid tr:first-child { display:none; }                     /* the column titles become labels inside each card */
    table.grid tr { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; background:#fff; border:1px solid var(--line);
               border-left:5px solid var(--blue); border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(26,58,92,.08); }
    table.grid tr.mine { border-left-color:#2e7d32; background:var(--mine); }
    table.grid tr.taken { background:var(--taken); }
    table.grid tr.overrow { border-left-color:var(--err); background:#fdecea; }
    table.grid tr.past { border-left-color:#bbb; background:#eee; }
    table.grid td { display:block; min-width:0; padding:0; border:0; background:transparent; position:static; box-shadow:none; }
    table.grid tr.past td, table.grid tr.past td * { background:transparent !important; }
    table.grid td.c-sno { order:1; font-weight:700; color:#fff; background:var(--navy); border-radius:12px; padding:1px 9px; font-size:13px; }
    table.grid tr.past td.c-sno { background:#bbb !important; color:#fff !important; }
    table.grid td.c-school { order:2; flex:1; font:700 17px/1.25 'DM Sans', 'Noto Sans Telugu', 'Noto Sans Devanagari', sans-serif; color:var(--navy); }
    table.grid td.c-time, table.grid td.c-when { order:3; width:100%; color:var(--slate); font-weight:500; }
    table.grid td.c-slots { order:4; font-weight:700; color:var(--navy); background:#E6EEF7; border-radius:12px; padding:2px 10px; font-size:13px; }
    table.grid td.c-slots.overcount { color:var(--err); background:#fff; }
    table.grid td.c-btn { order:5; margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
    table.grid td.c-btn button { padding:9px 18px; font-size:15px; border-radius:10px; }
    table.grid td.c-who { order:6; width:100%; border-top:1px solid var(--line); padding-top:8px; margin-top:4px; }
    table.grid td.c-who:empty { display:none; }
    table.grid td.c-who .person { white-space:normal; }
    /* Ongoing programs: the backup block (places, buttons, names) comes under the primary one */
    table.grid td.c-btn .ask { flex-basis:100%; text-align:right; font-size:14px; color:var(--slate); }
    table.grid td.c-addr, table.grid td.c-map, table.grid td.c-more { order:7; width:100%; display:flex; gap:8px; font-size:14px; color:var(--slate); }
    table.grid td.c-map { order:8; } table.grid td.c-more { order:10; }
    table.grid td.c-addr::before, table.grid td.c-map::before, table.grid td.c-more::before { content:attr(data-label); flex:0 0 38%; color:var(--muted); font-size:13px; }
    table.grid td.c-dup, table.grid td.c-more, table.grid td.c-blank { display:none; }   /* duplicates of the badge / the chosen date; the rest sit behind "Details" */
    table.grid tr.open td.c-more:not(.c-blank) { display:flex; }
    table.grid td.c-toggle { display:block; order:11; width:100%; }
    table.grid td.c-toggle button { background:#fff; color:var(--blue); border-color:var(--line); padding:6px 12px; }
  }
  /* Tablets: room for everything, so contacts and remarks show without "Details", two lines side by side. */
  @media (min-width: 701px) and (max-width: 1100px) {
    table.grid tr td.c-more:not(.c-blank) { display:flex; }
    table.grid td.c-toggle { display:none; }
    table.grid td.c-addr, table.grid td.c-map, table.grid td.c-more { width:calc(50% - 5px); }
  }
</style>
</head>

          addButton(t(x.role || 'primary') + (room ? '' : ' ' + t('full')), room ? '' : 'warn', function () { act('claimRow', r, 'registering', undefined, x.role); });
        });
        addButton(t('cancel'), 'release', function () { askRow = null; render(); });
      } else if (!mine || !justMe) {
        // A full school can still take more; the extra people show in red. (On either role of a program you can't take the other.)
        addButton(hasRoom ? t('claim') : t('claimFull'), hasRoom ? '' : 'warn', function () {
          if (open.length === 1) return act('claimRow', r, 'registering', undefined, open[0].role);
          if (!myName()) { setStatus(t('enterName'), true); nameInput.focus(); return; }
          if (!claimCount()) return;
          setStatus('');
          askRow = r.row; render();
        });
      }
      roles.forEach(function (x) {
        var onIt = !!me && x.part.assignees.some(function (a) { return same(a.name, me); });
        if (onIt && !r.past) addButton(t('release'), 'release', function () { act('releaseRow', r, 'releasing', undefined, x.role); });
      });
      var slots = tr.insertCell();
      slots.className = 'c-slots';
      roles.filter(function (x) { return !state.ongoing || x.part.total > 0 || x.part.assignees.length; }).forEach(function (x, i) {
        if (x.part.over) slots.className = 'c-slots overcount';
        var count = x.part.over ? t('overBy', x.part.over, x.part.total) : t('nOfM', x.part.remaining, x.part.total);
        if (!state.ongoing) { slots.textContent = count; return; }
        var one = document.createElement('span');                // one line per role
        one.className = 'roleline';
        one.textContent = t(x.role || 'primary') + ' ' + count;
        slots.appendChild(one);
      });
      var who = tr.insertCell();
      who.className = 'who c-who';
      var everyone = [];
      roles.forEach(function (x) { x.part.assignees.forEach(function (a, i) { everyone.push({ a: a, role: x.role, extra: i >= x.part.total }); }); });
      everyone.forEach(function (p, i) {
        var a = p.a;
        var line = document.createElement('div');
        line.className = 'person';
        if (p.extra) line.className += ' extra';
        line.textContent = (everyone.length > 1 ? (i + 1) + '. ' : '') + a.name;
        if (a.phone) {                                     // the number on wider screens; a call button on phones
          var num = document.createElement('span');
          num.className = 'num';
          num.textContent = ' · ' + a.phone;
          line.appendChild(num);
          var call = document.createElement('a');
          call.className = 'call';
          call.href = 'tel:' + telOf(a.phone);
          call.target = '_top';                            // the page runs inside Google's frame
          call.setAttribute('aria-label', t('callX', a.name));
          call.title = t('callX', a.name);
          call.innerHTML = PHONE_ICON;
          line.appendChild(call);
        }
        if (p.extra) line.appendChild(document.createTextNode(t('overLimit')));
        if (p.role) {
          var tag = document.createElement('span');
          tag.className = 'roletag';
          tag.textContent = t(p.role);
          line.appendChild(tag);
        }
        if (a.by) {
          var via = document.createElement('span');
          via.className = 'via';
          via.textContent = t('via', a.by);
          line.appendChild(via);
        }
        if (!r.past && me && a.by && same(a.by, me) && !same(a.name, me)) {
          var x = document.createElement('button');
          x.className = 'x';
          x.textContent = '✕';
          x.title = t('removeX', a.name);
          x.disabled = busyRow !== null;
          x.onclick = function () { act('removePerson', r, 'removing', a.name, p.role); };
          line.appendChild(x);
        }
        who.appendChild(line);
      });
    }
    state.rows.forEach(function (r) {
      var mine = isMine(r);
      var clashWith = justMe && !mine && r.start ? clashOf(r) : '';
      var hasRoom = r.remaining > 0 || !!(r.backup && r.backup.remaining > 0);
      if (hasRoom && !r.past) open++;
      var myReg = isMyReg(r);
      if (myReg) myCount++;
      // "Open only" filters "All Schools": no ended slots and no full schools. Your own always stay under "My Registrations".
      else if (openOnly.checked && (r.past || !hasRoom)) return;
      var tr = (myReg ? mineGrid : grid).insertRow();
      tr.setAttribute('data-row', r.row);
      tr.className = r.past ? 'past' : mine ? 'mine' : r.over || (r.backup && r.backup.over) ? 'overrow' : (hasRoom ? '' : 'taken');
      if (snoIdx >= 0) { var sno = tr.insertCell(); sno.textContent = r.cells[snoIdx]; sno.className = 'c-sno'; }
      roleCells(tr, r, mine, clashWith);
      if (state.ongoing) { var when = tr.insertCell(); when.className = 'c-when'; when.textContent = whenText(r); }
      var hasMore = false;
      r.cells.forEach(function (c, i) {
        if (!shown(c, i)) return;
        var td = tr.insertCell();
        addText(td, c);
        td.className = kinds[i] + (String(c).trim() ? '' : ' c-blank');
        td.setAttribute('data-label', String(state.headers[i]).replace(/\s+/g, ' ').trim());
        if (kinds[i] === 'c-more' && String(c).trim()) hasMore = true;
      });
      if (hasMore) {                                      // phones: contacts and remarks open on tap
        if (openDetails[r.row]) tr.className += ' open';
        var tg = tr.insertCell(), tb = document.createElement('button');
        tg.className = 'c-toggle';
        tb.type = 'button';
        tb.textContent = openDetails[r.row] ? t('hideDetails') : t('details');
        tb.onclick = function () {
          openDetails[r.row] = !openDetails[r.row];
          tr.classList.toggle('open', !!openDetails[r.row]);
          tb.textContent = openDetails[r.row] ? t('hideDetails') : t('details');
        };
        tg.appendChild(tb);
      }
    });
    document.getElementById('mineBox').hidden = !myCount;
    document.getElementById('mineTitle').textContent = t('myRegs', myCount);
    document.getElementById('allTitle').hidden = !myCount;
    document.getElementById('allTitle').textContent = t('allSchools');
    pinColumns();
    document.title = t('freeTitle', open, state.tab);
    if (!state.rows.length) grid.insertRow().insertCell().textContent = t('noRows');
  }

  var openDetails = {}; // sheet rows whose "Details" are open on a phone; kept across the 15-second refresh

  // Keep the first columns (Sl.No, button, Slots left) in view while the table scrolls sideways.
  function pinColumns() { ['mine', 'grid'].forEach(function (id) { pinTable(document.getElementById(id)); }); }
  function pinTable(grid) {
    if (!grid.rows.length) return;
    var lefts = [], x = 0;
    [].forEach.call(grid.rows[0].cells, function (th) { if (/\bstick\b/.test(th.className)) { lefts.push(x); x += th.getBoundingClientRect().width; } });
    [].forEach.call(grid.rows, function (tr, n) {
      lefts.forEach(function (left, i) {
        var c = tr.cells[i];
        if (!c) return;
        if (n) c.classList.add('stick');
        if (n && i === lefts.length - 1) c.classList.add('stick-last');
        c.style.left = left + 'px';
      });
    });
  }
  // Widths change after the web fonts load or the window resizes, so measure again then.
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { pinColumns(); });
    ro.observe(document.getElementById('grid')); ro.observe(document.getElementById('mine'));
  }
  else window.addEventListener('resize', pinColumns);

  // Language: English when the page opens; switching redraws everything in the chosen language.
  var langSelect = document.getElementById('lang');
  langSelect.value = LANG;
  langSelect.addEventListener('change', function () {
    LANG = langSelect.value;
    applyStaticText();
    setStatus('');
    if (lastUpdated) document.getElementById('updated').textContent = t('updated', lastUpdated);
    pickList.dataset.sig = '';
    if (state) { drawPicker(true); render(); } else document.getElementById('title').textContent = t('loading');
  });
  applyStaticText();

  // Demo video in the page's language: plays in a pop-up player (inline on phones); a Google Drive link
  // opens Drive's own player.
  (function () {
    var box = document.getElementById('demoBox'), video = document.getElementById('demoVideo');
    var link = document.getElementById('demoLink'), btn = document.getElementById('demoBtn');
    if (!(DEMO_VIDEO_URLS.en || []).length) { btn.hidden = true; return; }
    var urls = null, tried = 0;
    video.addEventListener('error', function () {                // try the next copy, else offer the link
      if (urls && ++tried < urls.length) { video.src = urls[tried]; video.play().catch(function () {}); }
    });
    function close() { box.hidden = true; video.pause(); }
    btn.addEventListener('click', function () {
      var list = (DEMO_VIDEO_URLS[LANG] || []).length ? DEMO_VIDEO_URLS[LANG] : DEMO_VIDEO_URLS.en;
      link.href = list[0];
      if (/drive\.google\.com/.test(list[0])) { window.open(list[0], '_blank', 'noopener'); return; }
      box.hidden = false;
      if (list !== urls) { urls = list; tried = 0; video.src = list[0]; }   // first time, or the language changed
      video.play().catch(function () {});
    });
    document.getElementById('demoClose').addEventListener('click', close);
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) close(); });
  })();

  // The server puts the first day's data into the page (see doGet); without it, ask for it.
  var INITIAL_STATE = /*INITIAL_STATE*/null;
  loadingSince = 0;
  if (INITIAL_STATE) show(INITIAL_STATE); else refresh();
  setInterval(function () { if (!document.hidden && busyRow === null) refresh(); }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
</script>
</body>
</html>
